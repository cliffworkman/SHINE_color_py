[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shine-color"
version = "0.1.0.dev0"
description = "Python reimplementation of the repaired SHINE_color MATLAB toolbox (behavioral port, in progress)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["shine_color*"]
