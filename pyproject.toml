[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shine-color"
version = "0.1.0.dev0"
description = "Python behavioral reimplementation and research-workflow continuation of SHINE_color"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]
reference = ["scipy>=1.10", "scikit-image==0.25.2"]

[project.urls]
Repository = "https://github.com/cliffworkman/SHINE_color_py"
Documentation = "https://github.com/cliffworkman/SHINE_color_py#readme"
"Original SHINE_color" = "https://github.com/RodDalBen/SHINE_color"
"SHINE_color paper" = "https://doi.org/10.1016/j.mex.2023.102377"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "docs/UPSTREAM_TOOLBOX_LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["shine_color*"]

[tool.pytest.ini_options]
markers = [
    "octave_degenerate_spectrum: positively tested backend-sensitive Fourier degeneracy",
    "octave_natural_image: exact parity on the recorded three-photo corpus only",
]
