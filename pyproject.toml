[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shine-color"
version = "0.1.0.dev0"
description = "Python reimplementation of the repaired SHINE_color MATLAB toolbox (behavioral port, in progress)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10"]
reference = ["scipy>=1.10", "scikit-image==0.25.2"]

[tool.setuptools.packages.find]
include = ["shine_color*"]

[tool.pytest.ini_options]
markers = [
    "octave_degenerate_spectrum: positively tested backend-sensitive Fourier degeneracy",
    "octave_natural_image: exact parity on the recorded three-photo corpus only",
]
